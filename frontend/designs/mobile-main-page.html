<!DOCTYPE html>
<html class="light" lang="en" style="">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>TranSafe - User App Home</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#53596b",
                        "secondary-container": "#dee3eb",
                        "on-error": "#ffffff",
                        "surface-variant": "#e1e3e4",
                        "tertiary-fixed": "#dce2f7",
                        "on-tertiary-container": "#f8f8ff",
                        "surface-tint": "#0054d6",
                        "on-error-container": "#93000a",
                        "background": "#f8f9fa",
                        "on-secondary-fixed": "#161c22",
                        "surface-container-highest": "#e1e3e4",
                        "surface-container-high": "#e7e8e9",
                        "surface": "#f8f9fa",
                        "on-background": "#191c1d",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#edeeef",
                        "tertiary-container": "#6b7284",
                        "secondary": "#595f66",
                        "on-surface-variant": "#424656",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f8f9fa",
                        "on-secondary-container": "#5f656c",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#c0c6db",
                        "primary": "#0050cb",
                        "primary-fixed": "#dae1ff",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#003fa4",
                        "on-tertiary-fixed": "#141b2b",
                        "on-primary-container": "#f8f7ff",
                        "on-tertiary-fixed-variant": "#404758",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f3f4f5",
                        "outline": "#727687",
                        "outline-variant": "#c2c6d8",
                        "secondary-fixed-dim": "#c2c7cf",
                        "secondary-fixed": "#dee3eb",
                        "primary-fixed-dim": "#b3c5ff",
                        "inverse-surface": "#2e3132",
                        "primary-container": "#0066ff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#42474e",
                        "surface-dim": "#d9dadb",
                        "inverse-on-surface": "#f0f1f2",
                        "on-primary-fixed": "#001849",
                        "inverse-primary": "#b3c5ff",
                        "on-surface": "#191c1d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "stack-lg": "40px",
                        "stack-md": "24px",
                        "base": "8px",
                        "stack-sm": "12px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0f2f5;
            /* Desktop background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .mobile-frame {
            width: 390px;
            height: 844px;
            /* Typical mobile height */
            background-color: #f8f9fa;
            /* Surface color */
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 8px solid #1a1a1a;
            /* Simulate phone bezel */
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 80px;
            /* Space for bottom nav */
        }

        /* Hide scrollbar for a cleaner look */
        .scrollable-content::-webkit-scrollbar {
            display: none;
        }

        .scrollable-content {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .blue-header-bg {
            background-color: #0066ff;
            height: 200px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            z-index: 0;
        }

        .header-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAt_h_ahegxhheaiZCVYR-P0HmCIDnNsYovU_eVwq_JPlpuVaZiRMQwT4hQa7LRjctfed_wAEahPN5NE2acnex1R56fCc9PviziQImKyAm1YmOGJ9llZZnvoXNnN2wEKgm_iRnelXvxr9BeAiVGl7goMdJjoAVzhqLf0YoRq__II4acqPmE9wwpKADzyXRSEd9ZeOboDbCwfjJyUcOIcuTSaC5mC0nMN2zwhoiPagx_KuqXyglYWlUouyrdnefuWHPLkgjxbcEDp5U");
            background-repeat: no-repeat;
            background-position: right center;
            background-size: contain;
            filter: brightness(0) invert(1);
            opacity: 0.15;
            z-index: 1;
        }
    </style>
</head>

<body class="text-on-background">
    <!-- Mobile Frame Simulator -->
    <div class="mobile-frame">
        <!-- Blue Header Background (Decorative) -->
        <div class="blue-header-bg" style="height: 120px;">
            <div class="header-pattern"></div>
        </div>
        <!-- TopAppBar (from JSON) -->
        <header class="relative z-20 flex justify-between items-center w-full px-6 py-4 pt-12 h-[120px]">
            <h1 class="text-display-lg font-display-lg font-bold text-white tracking-tight">TranSafe</h1>
            <div class="flex gap-4">
                <button class="text-white hover:bg-white/10 transition-colors p-2 rounded-full scale-95 duration-150">
                    <span class="material-symbols-outlined"
                        style="font-variation-settings: &quot;FILL&quot; 0;">notifications</span>
                </button>
                <button class="text-white hover:bg-white/10 transition-colors p-2 rounded-full scale-95 duration-150">
                    <span class="material-symbols-outlined"
                        style="font-variation-settings: &quot;FILL&quot; 0;">help_outline</span>
                </button>
            </div>
        </header>
        <!-- Main Content Area -->
        <main class="relative z-10 scrollable-content px-6 flex flex-col gap-6">
            <div class="mt-4">
                <h2 class="text-headline-lg-mobile text-on-surface font-bold">Welcome back, JOHN</h2>
                <p class="text-secondary mt-1 text-label-sm">Here is what's happening with your accounts today.</p>
            </div>
            <!-- Balance Card -->
            <div class="bg-surface-container-lowest rounded-[24px] p-6 shadow-[0_8px_30px_rgba(0,0,0,0.08)] mt-2">
                <p class="text-label-md font-label-md text-secondary uppercase tracking-wider mb-2">Savings Account</p>
                <h2 class="text-display-lg font-display-lg text-on-surface mb-6">RM 24,530.80</h2>
                <button
                    class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-4 rounded-[16px] hover:bg-primary transition-colors flex justify-center items-center gap-2">
                    <span class="material-symbols-outlined"
                        style="font-variation-settings: &quot;FILL&quot; 1;">send</span>
                    Send Money
                </button>
            </div>
            <!-- Quick Actions Grid (Inspired by image) -->
            <div class="grid grid-cols-3 gap-4 mt-2">
                <button
                    class="flex flex-col items-center justify-center bg-surface-container-lowest p-4 rounded-[20px] shadow-[0_4px_20px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] transition-all group">
                    <div
                        class="w-12 h-12 bg-primary-fixed rounded-[14px] flex items-center justify-center mb-2 group-hover:scale-105 transition-transform">
                        <span class="material-symbols-outlined text-primary"
                            style="font-variation-settings: &quot;FILL&quot; 0;">account_circle</span>
                    </div>
                    <span class="text-label-sm font-label-sm text-on-surface text-center">My Account</span>
                </button>
                <button
                    class="flex flex-col items-center justify-center bg-surface-container-lowest p-4 rounded-[20px] shadow-[0_4px_20px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] transition-all group">
                    <div
                        class="w-12 h-12 bg-primary-fixed rounded-[14px] flex items-center justify-center mb-2 group-hover:scale-105 transition-transform">
                        <span class="material-symbols-outlined text-primary"
                            style="font-variation-settings: &quot;FILL&quot; 0;">sync_alt</span>
                    </div>
                    <span class="text-label-sm font-label-sm text-on-surface text-center">Transfer</span>
                </button>
                <button
                    class="flex flex-col items-center justify-center bg-surface-container-lowest p-4 rounded-[20px] shadow-[0_4px_20px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] transition-all group">
                    <div
                        class="w-12 h-12 bg-primary-fixed rounded-[14px] flex items-center justify-center mb-2 group-hover:scale-105 transition-transform">
                        <span class="material-symbols-outlined text-primary"
                            style="font-variation-settings: &quot;FILL&quot; 0;">description</span>
                    </div>
                    <span class="text-label-sm font-label-sm text-on-surface text-center">Statement</span>
                </button>
                <button
                    class="flex flex-col items-center justify-center bg-surface-container-lowest p-4 rounded-[20px] shadow-[0_4px_20px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] transition-all group">
                    <div
                        class="w-12 h-12 bg-primary-fixed rounded-[14px] flex items-center justify-center mb-2 group-hover:scale-105 transition-transform">
                        <span class="material-symbols-outlined text-primary"
                            style="font-variation-settings: &quot;FILL&quot; 0;">real_estate_agent</span>
                    </div>
                    <span class="text-label-sm font-label-sm text-on-surface text-center">My Loans</span>
                </button>
                <button
                    class="flex flex-col items-center justify-center bg-surface-container-lowest p-4 rounded-[20px] shadow-[0_4px_20px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] transition-all group">
                    <div
                        class="w-12 h-12 bg-primary-fixed rounded-[14px] flex items-center justify-center mb-2 group-hover:scale-105 transition-transform">
                        <span class="material-symbols-outlined text-primary"
                            style="font-variation-settings: &quot;FILL&quot; 0;">account_balance_wallet</span>
                    </div>
                    <span class="text-label-sm font-label-sm text-on-surface text-center">Deposits</span>
                </button>
                <button
                    class="flex flex-col items-center justify-center bg-surface-container-lowest p-4 rounded-[20px] shadow-[0_4px_20px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] transition-all group">
                    <div
                        class="w-12 h-12 bg-secondary-fixed rounded-[14px] flex items-center justify-center mb-2 group-hover:scale-105 transition-transform">
                        <span class="material-symbols-outlined text-secondary"
                            style="font-variation-settings: &quot;FILL&quot; 0;">add</span>
                    </div>
                    <span class="text-label-sm font-label-sm text-on-surface text-center">More</span>
                </button>
            </div>
            <!-- Recent Activity List -->
            <div class="mt-4">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-headline-sm font-headline-md text-on-surface">Recent Activity</h3>
                    <button class="text-primary font-label-sm text-label-sm hover:underline">See All</button>
                </div>
                <div class="flex flex-col gap-3">
                    <!-- Transaction 1 -->
                    <div
                        class="bg-surface-container-lowest p-4 rounded-[16px] flex items-center justify-between shadow-[0_4px_20px_rgba(0,0,0,0.03)] hover:bg-surface-container-low transition-colors cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-error-container rounded-full flex items-center justify-center">
                                <span class="material-symbols-outlined text-error"
                                    style="font-variation-settings: &quot;FILL&quot; 0;">arrow_upward</span>
                            </div>
                            <div>
                                <p class="text-body-md font-body-md font-semibold text-on-surface">Ali Bin Ahmad</p>
                                <p class="text-label-sm font-label-sm text-secondary">Today, 10:30 AM</p>
                            </div>
                        </div>
                        <p class="text-body-md font-body-md font-bold text-on-surface">-RM 150.00</p>
                    </div>
                    <!-- Transaction 2 -->
                    <div
                        class="bg-surface-container-lowest p-4 rounded-[16px] flex items-center justify-between shadow-[0_4px_20px_rgba(0,0,0,0.03)] hover:bg-surface-container-low transition-colors cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-primary-fixed rounded-full flex items-center justify-center">
                                <span class="material-symbols-outlined text-primary"
                                    style="font-variation-settings: &quot;FILL&quot; 0;">arrow_downward</span>
                            </div>
                            <div>
                                <p class="text-body-md font-body-md font-semibold text-on-surface">Salary Deposit</p>
                                <p class="text-label-sm font-label-sm text-secondary">Yesterday</p>
                            </div>
                        </div>
                        <p class="text-body-md font-body-md font-bold text-primary">+RM 4,500.00</p>
                    </div>
                </div>
            </div>
            <!-- Promo Banner -->
        </main>
        <!-- BottomNavBar (from JSON) -->
        <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface dark:bg-surface-container shadow-[0_-4px_20px_rgba(0,0,0,0.05)] rounded-t-[24px]"
            style="position: absolute; /* override fixed for mobile frame sim */">
            <button
                class="flex flex-col items-center justify-center bg-primary-container text-primary rounded-xl px-4 py-1 hover:bg-secondary-container/50 scale-90 transition-transform">
                <span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">home</span>
                <span class="text-label-sm font-label-sm text-primary font-bold">Home</span>
            </button>
            <button
                class="flex flex-col items-center justify-center text-secondary p-2 hover:bg-secondary-container/50 transition-colors rounded-xl">
                <span class="material-symbols-outlined"
                    style="font-variation-settings: &quot;FILL&quot; 0;">receipt_long</span>
                <span class="text-label-sm font-label-sm mt-1">Activity</span>
            </button>
            <button
                class="flex flex-col items-center justify-center text-secondary p-2 hover:bg-secondary-container/50 transition-colors rounded-xl">
                <span class="material-symbols-outlined"
                    style="font-variation-settings: &quot;FILL&quot; 0;">verified_user</span>
                <span class="text-label-sm font-label-sm mt-1">Safety</span>
            </button>
            <button
                class="flex flex-col items-center justify-center text-secondary p-2 hover:bg-secondary-container/50 transition-colors rounded-xl">
                <span class="material-symbols-outlined"
                    style="font-variation-settings: &quot;FILL&quot; 0;">person</span>
                <span class="text-label-sm font-label-sm mt-1">Profile</span>
            </button>
        </nav>
    </div>
</body>

</html>
